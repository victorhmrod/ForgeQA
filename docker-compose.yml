services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forgeqa}
      POSTGRES_USER: ${POSTGRES_USER:-forgeqa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forgeqa} -d ${POSTGRES_DB:-forgeqa}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - forgeqa

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-forgeqa}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - forgeqa

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-forgeqa}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
      MINIO_BUCKET: ${MINIO_BUCKET:-forgeqa-artifacts}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    entrypoint: >-
      /bin/sh -c '
      mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
      mc mb --ignore-existing local/"$${MINIO_BUCKET}";
      mc anonymous set none local/"$${MINIO_BUCKET}";
      cat > /tmp/cors.xml <<EOF
      <CORSConfiguration>
        <CORSRule>
          <AllowedOrigin>$${CORS_ALLOWED_ORIGIN}</AllowedOrigin>
          <AllowedMethod>GET</AllowedMethod>
          <AllowedMethod>PUT</AllowedMethod>
          <AllowedMethod>HEAD</AllowedMethod>
          <AllowedHeader>*</AllowedHeader>
          <ExposeHeader>ETag</ExposeHeader>
          <MaxAgeSeconds>3600</MaxAgeSeconds>
        </CORSRule>
      </CORSConfiguration>
      EOF
      mc cors set local/"$${MINIO_BUCKET}" /tmp/cors.xml;
      '
    networks:
      - forgeqa

  backend:
    build:
      context: ./backend
      dockerfile: src/ForgeQA.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-forgeqa};Username=${POSTGRES_USER:-forgeqa};Password=${POSTGRES_PASSWORD:-change-me}
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      Jwt__Issuer: ${JWT_ISSUER:-ForgeQA}
      Jwt__Audience: ${JWT_AUDIENCE:-ForgeQA}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS:-30}
      ArtifactStorage__Endpoint: ${MINIO_ENDPOINT:-http://minio:9000}
      ArtifactStorage__PublicEndpoint: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      ArtifactStorage__Region: ${MINIO_REGION:-us-east-1}
      ArtifactStorage__Bucket: ${MINIO_BUCKET:-forgeqa-artifacts}
      ArtifactStorage__AccessKey: ${MINIO_ROOT_USER:-forgeqa}
      ArtifactStorage__SecretKey: ${MINIO_ROOT_PASSWORD:-change-me-minio}
      ArtifactStorage__ForcePathStyle: "true"
      ArtifactStorage__MultipartPartSizeBytes: ${ARTIFACT_PART_SIZE_BYTES:-67108864}
      ArtifactStorage__MaxArtifactSizeBytes: ${ARTIFACT_MAX_SIZE_BYTES:-107374182400}
      ArtifactStorage__UploadSessionLifetimeMinutes: ${ARTIFACT_UPLOAD_SESSION_MINUTES:-60}
      ArtifactStorage__DownloadUrlLifetimeMinutes: ${ARTIFACT_DOWNLOAD_URL_MINUTES:-10}
      ArtifactStorage__MaxPresignedPartsPerRequest: ${ARTIFACT_MAX_PRESIGNED_PARTS:-50}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - forgeqa

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - forgeqa

networks:
  forgeqa:

volumes:
  postgres_data:
  minio_data:
